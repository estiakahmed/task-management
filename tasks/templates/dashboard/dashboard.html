<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

  <div class="min-h-screen p-4 sm:p-6 lg:p-8">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">
      
      <h1 class="text-xl sm:text-2xl font-semibold">Dashboard</h1>

      <div class="flex items-center gap-4 sm:gap-6">
        
        <!-- Notification -->
        <button class="rounded-full p-2 sm:p-3 hover:bg-gray-100 relative transition">
          <svg xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="w-5 h-5 sm:w-6 sm:h-6 text-gray-600">
            <path stroke-linecap="round"
              stroke-linejoin="round"
              d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0" />
          </svg>

          
        </button>

        <!-- Profile -->
        <div class="w-8 h-8 rounded-full bg-blue-600 
                    text-white flex items-center 
                    justify-center font-medium text-sm">
          B
        </div>

      </div>
    </div>


    <!-- Stats Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
      
      <div class="bg-white p-6 rounded-xl shadow-sm">
        <p class="text-gray-500 text-sm">TOTAL TASK</p>
        <h2 class="text-3xl font-bold mt-2">3</h2>
        <p class="text-gray-400 text-sm mt-1">11 last month</p>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm">
        <p class="text-gray-500 text-sm">COMPLETED TASK</p>
        <h2 class="text-3xl font-bold mt-2">1</h2>
        <p class="text-gray-400 text-sm mt-1">11 last month</p>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm">
        <p class="text-gray-500 text-sm">TASK IN PROGRESS</p>
        <h2 class="text-3xl font-bold mt-2">1</h2>
        <p class="text-gray-400 text-sm mt-1">11 last month</p>
      </div>

      <div class="bg-white p-6 rounded-xl shadow-sm">
        <p class="text-gray-500 text-sm">TODOS</p>
        <h2 class="text-3xl font-bold mt-2">1</h2>
        <p class="text-gray-400 text-sm mt-1">11 last month</p>
      </div>

    </div>


    {% block tasks %}
    
    {% endblock tasks %}

    

  </div>

</body>
</html>
